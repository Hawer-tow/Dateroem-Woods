<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#fff}#wrap{display:inline-block;padding:10px}</style>
<script src="lib_draw.js"></script>
</head><body><div id="wrap"></div>
<script>
const D = Draw;
const W = 180, H = 56;
const X = [30, 250, 470, 690], Y = [20, 130, 300, 410, 520];
const box = (c, r, t, s, k) => D.box(X[c], Y[r], W, H, t, s, k || 'bff');
D.start(900, 600);
box(0, 0, 'FARMER', 'name, phone', 'plain');
D.box(250, 20, 620, H, 'TRIP', 'the hub: dates, hard and soft cash, total payment, body feet', 'core');
box(0, 1, 'TREES', 'household, GPS, number');
D.box(250, 130, 180, 140, 'Expense tables', 'TRANSPORT\nCOMMUNICATIONS\nMACHINE_EXPENSES\nOTHER_EXPENSES\nPERMITS, ACCOMODATION\nSALARIES', 'bff');
box(2, 1, 'LOAN', 'ACTIVE / PAID ...');
box(3, 1, 'PROFIT', 'one row per trip');
box(0, 2, 'REMAINDER_TREES', 'carried to a later trip');
box(1, 2, 'VEHICLE, MACHINE', 'picked on expenses', 'plain');
box(2, 2, 'LOAN_REPAYMENTS', 'paid or pending');
box(3, 2, 'CAPITAL', 'money before the trip');
box(0, 3, 'FARMER_PAYMENTS', 'farmer and tree');
box(1, 3, 'BULK_DELIVERY, ORDERS', 'soft cash, refunds', 'plain');
box(3, 3, 'SMS_QUEUE', 'company SIM messages', 'plain');
D.box(30, 520, 620, H, 'FINANCIAL_TRANSACTION', 'every M-Pesa or cash movement - matched to what it paid for', 'core');
box(3, 4, 'AUDIT_LOGS', 'who changed what', 'plain');

// farmer -> trees, trip -> trees
D.arrow([[120, 76], [120, 130]], '', null);
D.arrow([[270, 76], [270, 104], [230, 104], [230, 158], [210, 158]], '', null);
// trip -> expenses, loan, profit
D.arrow([[340, 76], [340, 130]], '', null);
D.arrow([[560, 76], [560, 130]], '', null);
D.arrow([[780, 76], [780, 130]], '', null);
// trip -> capital (right margin)
D.arrow([[870, 48], [886, 48], [886, 328], [870, 328]], '', null);
// trees <-> remainder
D.arrow([[120, 186], [120, 300]], 'carried forward', [128, 250], { anchor: 'start', both: true });
// loan -> repayments
D.arrow([[560, 186], [560, 300]], '', null);
// vehicle/machine -> expenses
D.arrow([[340, 300], [340, 270]], '', null);
// farmer -> farmer payments (left margin)
D.arrow([[30, 48], [15, 48], [15, 438], [30, 438]], '', null);
// sms -> financial transaction
D.arrow([[780, 466], [780, 500], [660, 500], [660, 548], [650, 548]], '', null);
// financial transaction -> what it pays (dashed)
D.arrow([[120, 520], [120, 466]], '', null, { dashed: true });
D.arrow([[240, 520], [240, 200], [250, 200]], '', null, { dashed: true });
D.arrow([[340, 520], [340, 466]], '', null, { dashed: true });
D.arrow([[560, 520], [560, 356]], '', null, { dashed: true });
D.note(440, 505, 'dashed: "assigned to" / pays', { size: 12.5 });
D.done();
</script></body></html>
